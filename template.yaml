# Metadatos de la plantilla para el catálogo de NoExpertise.
id: corporativa-clasica
nombre: Corporativa clásica
descripcion: Web seria y ordenada para despachos, asesorías y empresas de servicios.
sectores: [servicios, despacho, consultoria]
secciones: [hero, servicios, sobre-nosotros, equipo, testimonios, contacto]
estilo: sobrio
plan_minimo: gratis
version: 1.3.0
base: astrowind
demo_url: https://demo-plantilla-corporativa-clasica.noexpertise.com
activa: true
orden: 10

# Asistente de puesta en marcha (NoExpertise): un paso por pantalla. Rutas del site sin índices;
# tipos: texto y lista (la IA propone), datos, fotos, eleccion (colores y logo) y repaso.
asistente:
  - id: negocio
    titulo: "Tu empresa"
    pregunta: "¿Cómo se llama tu empresa o despacho y a qué os dedicáis?"
    ayuda: "Qué hacéis, para quién y desde dónde trabajáis."
    tipo: texto
    campos: [nombre, eslogan, secciones.hero.antetitulo, secciones.hero.titulo, secciones.hero.texto, seo.descripcion]
  - id: contacto
    titulo: "Cómo te encuentran"
    pregunta: "¿Dónde estáis y cómo os pueden llamar o escribir?"
    ayuda: "Solo lo que quieras que vean tus clientes. Lo que dejes vacío no sale en tu web."
    tipo: datos
    campos: [contacto.telefono, contacto.whatsapp, contacto.email, contacto.direccion, contacto.horario, redes.linkedin, redes.facebook]
  - id: servicios
    titulo: "Servicios"
    pregunta: "¿Qué servicios dais? Uno por línea, como se lo dirías a un cliente."
    tipo: texto
    campos: [secciones.servicios.titulo, secciones.servicios.texto, secciones.servicios.items]
  - id: sobre-nosotros
    titulo: "Quiénes sois"
    pregunta: "Cuéntame vuestra historia y qué os hace distintos."
    tipo: texto
    campos: [secciones.sobre-nosotros.titulo, secciones.sobre-nosotros.texto, secciones.sobre-nosotros.items]
  - id: equipo
    titulo: "Tu equipo"
    pregunta: "¿Quién forma el equipo? Nombre y qué hace cada uno, uno por línea."
    ayuda: "Las fotos las pones luego en Contenido."
    tipo: lista
    campos: [secciones.equipo.personas]
  - id: fotos
    titulo: "Tus fotos"
    pregunta: "Pon una foto de portada y, si quieres, alguna más."
    ayuda: "Sube las tuyas o elige una del banco. Las que no cambies se quedan como están."
    tipo: fotos
    campos: [secciones.hero.imagen, secciones.sobre-nosotros.imagen]
  - id: aspecto
    titulo: "Colores y logo"
    pregunta: "Elige los colores de tu web y, si tienes, tu logo."
    tipo: eleccion
    campos: [colores.primario, colores.acento, logo]
  - id: repaso
    titulo: "Repaso"
    tipo: repaso

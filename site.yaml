  tipo: AccountingService   # tipo de schema.org (LocalBusiness, Dentist, Restaurant…)
marca_pie: true   # «Web creada con NoExpertise» en el pie (plan gratis)

secciones:
  hero:
    activa: true
    antetitulo: Asesoría en Huesca desde 1998
    titulo: Tus números, en orden. Tu tiempo, para tu negocio.
    texto: Llevamos impuestos, contabilidad y nóminas de pymes y autónomos. Te explicamos cada paso sin tecnicismos.
    imagen: /fotos/hero.jpg
    cta: { texto: Pide una primera consulta, url: "/#contacto" }
    cta_secundario: { texto: Ver servicios, url: "/#servicios" }
    items:   # cifras de la franja inferior
      - { titulo: "25", texto: años de experiencia }
      - { titulo: "340", texto: clientes activos }
      - { titulo: "6", texto: profesionales colegiados }
      - { titulo: "48 h", texto: para responder cualquier consulta }

  servicios:
    activa: true
    antetitulo: Servicios
    titulo: Lo que hacemos por ti
    texto: Un solo despacho para todo el papeleo. Sin sorpresas en el precio.
    items:
      - { titulo: Fiscal, texto: "IVA, IRPF, Sociedades y modelos trimestrales. Planificamos para que pagues lo justo.", icono: balanza }
      - { titulo: Laboral, texto: "Nóminas, contratos, altas y bajas, y trato con la Seguridad Social.", icono: usuarios }
      - { titulo: Contable, texto: "Contabilidad al día, cuentas anuales y libros oficiales.", icono: grafico }
      - { titulo: Mercantil, texto: "Constitución de sociedades, actas, cambios de socios y herencias de empresa.", icono: maletin }

  sobre-nosotros:
    activa: true
    antetitulo: El despacho
    titulo: Cercanos, rigurosos y a tu lado
    texto: |
      Nacimos en 1998 en el Coso de Huesca. Hoy somos seis profesionales y seguimos trabajando igual: cada cliente tiene un asesor de referencia que conoce su negocio.

      Revisamos tu situación cada trimestre y te avisamos antes de que llegue un plazo. Así no hay prisas ni recargos.
    imagen: /fotos/sobre.jpg
    items:
      - { titulo: Un asesor de referencia, texto: Siempre hablas con la misma persona., icono: usuarios }
      - { titulo: Precio cerrado, texto: Cuota mensual sin extras escondidos., icono: escudo }
      - { titulo: Avisos de plazos, texto: Te recordamos cada vencimiento con tiempo., icono: calendario }

  equipo:
    activa: true
    antetitulo: Equipo
    titulo: Las personas que llevan tus cuentas
    personas:
      - { nombre: Pilar Arnal, cargo: Socia · Fiscal, foto: /fotos/persona-1.jpg, texto: Economista colegiada. 25 años en asesoría fiscal. }
      - { nombre: Javier Lasierra, cargo: Socio · Mercantil, foto: /fotos/persona-2.jpg, texto: "Abogado. Sociedades, contratos y empresa familiar." }
      - { nombre: Marta Gracia, cargo: Laboral, foto: /fotos/persona-3.jpg, texto: Graduada social. Nóminas y Seguridad Social. }
      - { nombre: Daniel Puyuelo, cargo: Contabilidad, foto: /fotos/persona-4.jpg, texto: Contabilidad de pymes y cooperativas. }

  testimonios:
    activa: true
    antetitulo: Clientes
    titulo: Lo que dicen quienes ya trabajan con nosotros
    testimonios:
      - { texto: "Desde que estamos con ellos no hemos tenido ni un recargo. Y cuando llamo, me lo explican claro.", autor: "Ana Bescós · Ferretería Bescós" }
      - { texto: Nos ayudaron a convertir la empresa familiar en sociedad sin perder un día de trabajo., autor: "Luis Allué · Transportes Allué" }
      - { texto: Son serios y cercanos a la vez. Para un autónomo eso vale mucho., autor: "Elena Sanz · Fisioterapeuta" }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Lo que nos preguntan antes de empezar
    preguntas:
      - { pregunta: "¿La primera consulta tiene coste?", respuesta: "No. La primera reunión para conocer tu caso es gratuita y sin compromiso, en el despacho o por videollamada." }
      - { pregunta: "¿Trabajáis con autónomos o solo con empresas?", respuesta: "Con los dos. Llevamos la fiscalidad, la contabilidad y las nóminas de autónomos, pymes y sociedades familiares." }
      - { pregunta: "¿Puedo cambiar de asesoría a mitad de año?", respuesta: "Sí. Nos encargamos del traspaso con tu asesoría anterior para que ningún trámite se quede a medias." }
      - { pregunta: "¿Cómo os hago llegar las facturas?", respuesta: "Como te resulte más cómodo: por correo, en papel en el despacho o en una carpeta compartida. Te recordamos cada plazo con tiempo." }
      - { pregunta: "¿Qué incluye la cuota mensual?", respuesta: "Lo que acordemos por escrito antes de empezar: impuestos, contabilidad o nóminas. Precio cerrado, sin extras escondidos." }

  contacto:
    activa: true
    antetitulo: Contacto
    titulo: Hablemos de tu caso
    texto: La primera consulta es sin coste. Cuéntanos qué necesitas y te llamamos en menos de 48 horas.
